# Publishes @studiocygnus/brand to npm. release.yml starts it on each new release tag.
#
# npm trusted publishing: npm accepts the OIDC token GitHub gives the `npm` job because the
# package's settings on npmjs.com name this repo, this file and the `npm` environment, so there is
# no npm token secret. npm adds provenance on its own.
#
# The two jobs keep the token away from third-party code. `build` installs the dev dependencies,
# runs the gate and packs the tarball, with no way to publish. `npm` runs no project code at all:
# it takes the tarball and publishes it. The `npm` environment only accepts release tags.
name: publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    # Only a release tag publishes; a manual run from a branch does nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks in the gate scans every commit, so it needs the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # The gate and the build, as CI runs them, on the tagged commit.
      - run: just ci
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # the OIDC token npm trusts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # The Node that mise.toml pins; its npm does the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm publish ./*.tgz
