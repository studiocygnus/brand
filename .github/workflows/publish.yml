# Publishes @studiocygnus/brand to npm. release.yml starts it on each new release tag.
#
# npm trusted publishing: npm accepts the OIDC token GitHub gives this workflow because the
# package's settings on npmjs.com name this repo and this file, so there is no npm token secret.
# npm adds provenance on its own. The npm that ships with the pinned Node does the OIDC exchange;
# bun publish doesn't.
name: publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  npm:
    # Only a release tag publishes; a manual run from a branch does nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks in the gate scans every commit, so it needs the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # The gate and the build, as CI runs them, on the tagged commit.
      - run: just ci
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish
