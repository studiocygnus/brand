<!-- The email signature. `just build` puts in the band's address, and the notice and legal name from
     src/company.json, and writes it to _site/email/signature.html. {name}, {title} and {email} are filled in per person. Mail clients
     keep only tables and inline styles, and no web fonts, so the text is Arial and the logo is an
     image that brings its own night ground for dark mode. -->
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="440"
  style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif"
>
  <tr>
    <td
      style="
        padding: 0 0 14px;
        font-size: 14px;
        line-height: 20px;
        color: #1f1f1f;
      "
    >
      Best regards,
    </td>
  </tr>
  <tr>
    <td
      style="
        padding: 0;
        font-size: 15px;
        line-height: 20px;
        font-weight: bold;
        color: #0b0e1a;
      "
    >
      {name}
    </td>
  </tr>
  <tr>
    <td
      style="
        padding: 2px 0 12px;
        font-size: 13px;
        line-height: 18px;
        color: #4f5870;
      "
    >
      {title} &middot;
      <a href="mailto:{email}" style="color: #456a8e; text-decoration: none"
        >{email}</a
      >
    </td>
  </tr>
  <tr>
    <td style="padding: 0 0 12px">
      <img
        src="{band}"
        width="440"
        height="60"
        alt="Studio Cygnus"
        style="display: block; width: 440px; height: 60px; border: 0"
      />
    </td>
  </tr>
  <tr>
    <td
      style="
        padding: 10px 0 0;
        border-top: 1px solid #d5d9e3;
        font-size: 10px;
        line-height: 15px;
        color: #4f5870;
      "
    >
      {notice} {legalName}
    </td>
  </tr>
</table>
